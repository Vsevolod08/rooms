services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose: ["5173"]
    networks:
      - app-network
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    networks:
      - app-network
    volumes:
      - ./backend:/app
      - /app/node_modules

  nginx:
    image: nginx:1.29-alpine
    depends_on:
      - frontend
      - backend
    ports: ["80:80"]
    networks:
      - app-network
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  app-network:
    driver: bridge
